@let scenariesCompletedLocal = scenariesCompleted();

<Section class="scenaries-container">
  <h3>scenaries-container works!</h3>

  <h4>{{ scenariesCompletedLocal.length }}</h4>

  <app-scenaries-filter
    (setFilter)="setfilter.emit($event)"
  ></app-scenaries-filter>

  <app-scenaries-dialog
    (update)="update.emit($event)"
    [scenariesCompleted]="scenariesCompleted"
  ></app-scenaries-dialog>

  <table mat-table matSort [dataSource]="scenaries">
    <!-- Name Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef>Position</th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox
          [checked]="element.completed"
          (change)="
            update.emit({ checked: $event.checked, battleScenarie: element })
          "
        >
          {{ element.type }}
        </mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
      <td mat-cell *matCellDef="let element">{{ element.description }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let myRowData; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [pageSize]="limit"
    [pageIndex]="page"
    [length]="totalElements"
    [pageSizeOptions]="[2, 4, 8]"
    aria-label="Select page of periodic elements"
    (page)="setPage.emit($event.pageIndex)"
    (page)="setLimit.emit($event.pageSize)"
  >
  </mat-paginator>
</Section>
