<section class="dialog-list">
  <h2 mat-dialog-title>Dialog with elements</h2>
  <mat-dialog-content>
    <mat-list>
      @for(element of data.elements(); track element.type) {
      <mat-list-item>
        <span matListItemTitle>{{ element.type }}</span>
        <span matListItemLine>{{ element.description.slice(0, 10) }}</span>
        <span matListItemLine>
          <button mat-button (click)="data.update(element)">Undo</button>
        </span>
      </mat-list-item>

      }
    </mat-list>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
</section>
